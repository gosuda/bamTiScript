[package]
name = "bamts-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
license.workspace = true
repository.workspace = true
description = "BamTS compiler command-line driver"

[[bin]]
name = "bamts"
path = "src/main.rs"

[dependencies]
bamts = { workspace = true, features = ["node-host"] }
bamts-compiler.workspace = true
bamts-runtime.workspace = true
bamts-codegen = { workspace = true, features = ["aot", "host-jit"] }
bamts-node.workspace = true
bamts-platform.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["event", "pipe", "process"] }

[build-dependencies]
bamts-node = { workspace = true, features = ["aot-main", "script-compiler"] }
serde_json = "=1.0.151"

[lints]
workspace = true
