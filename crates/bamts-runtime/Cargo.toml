[package]
name = "bamts-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
license.workspace = true
repository.workspace = true
description = "Execution runtime and built-in intrinsics for BamTS"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = []

[dependencies]
bamts-cancel.workspace = true
bamts-bytecode.workspace = true
bamts-native = { workspace = true, features = ["gc"] }
bamts-platform.workspace = true
icu_properties = { version = "=2.3.0", features = ["compiled_data"] }
unicode-normalization = "=0.1.24"

[lints]
workspace = true
