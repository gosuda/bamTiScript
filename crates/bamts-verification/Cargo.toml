[package]
name = "bamts-verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true
description = "Verification and compliance test suite for BamTS"
autobins = false
default-run = "bamts-verification"

[dependencies]
bamts = { workspace = true, features = ["aot", "host-jit"] }
bamts-bytecode.workspace = true
bamts-cli.workspace = true
bamts-codegen.workspace = true
bamts-compiler.workspace = true
bamts-native.workspace = true
bamts-platform.workspace = true
bamts-node = { workspace = true, features = ["script-compiler"] }
bamts-runtime.workspace = true
libc = "=0.2.189"
anyhow = "=1.0.104"
quint-connect = "=0.1.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde-saphyr = "=1.1.0"
serde_json = "=1.0.151"
sha2 = "=0.10.9"
getrandom = "=0.3.4"
toml = "=0.9.12"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[[bin]]
name = "bamts-verification"
path = "src/main.rs"

[[bin]]
name = "ts_conformance"
path = "src/bin/ts_conformance.rs"

[[bin]]
name = "perf_budget"
path = "src/bin/perf_budget.rs"

[[bin]]
name = "bh1_jit"
path = "src/bin/bh1_jit.rs"

[[bin]]
name = "ts_lane_worker"
path = "src/bin/ts_lane_worker.rs"

[[bin]]
name = "runtime_lane_worker"
path = "src/bin/runtime_lane_worker.rs"
