[package]
name = "bamts-codegen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
license.workspace = true
repository.workspace = true
description = "Code generation (JIT/AOT) backend for BamTS"

[dependencies]
bamts-bytecode.workspace = true
bamts-cancel.workspace = true
bamts-native = { workspace = true, optional = true }
cranelift-codegen = { version = "=0.134.2", default-features = false, features = ["std", "unwind", "all-native-arch"] }
cranelift-frontend = "=0.134.2"
cranelift-module = "=0.134.2"
cranelift-object = { version = "=0.134.2", optional = true }
cranelift-jit = { version = "=0.134.2", optional = true }
region = { version = "=3.0.2", optional = true }
sha2 = { version = "=0.10.9", optional = true }
wasmtime-internal-jit-icache-coherence = { version = "=47.0.2", optional = true }

[target.'cfg(all(target_arch = "aarch64", target_os = "linux"))'.dependencies]
libc = { version = "=0.2.189", optional = true }

[dev-dependencies]
bamts-platform.workspace = true
bamts-runtime.workspace = true

[features]
default = []
aot = ["dep:bamts-native", "dep:cranelift-object", "dep:sha2"]
host-jit = ["dep:cranelift-jit", "dep:bamts-native", "bamts-native/jit-entry", "dep:region", "dep:wasmtime-internal-jit-icache-coherence", "dep:libc"]

[lints.rust]
# `unsafe_code` is downgraded from the workspace `forbid` to `deny` so a single
# `#[allow(unsafe_code)]` may cover the one module that requires it: the W^X
# host-JIT memory provider (`jit_memory`), which owns the OS mapping syscalls.
# Note: this crate intentionally does not use `lints.workspace = true` because
# Cargo forbids mixing `workspace = true` with per-lint overrides. Any new
# `workspace.lints` added in the root must be manually mirrored here.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
