name: Cache Rust dependencies
description: Cache Cargo dependencies without authority snapshots or receipt artifacts.

runs:
  using: composite
  steps:
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        prefix-key: v1-rust-${{ github.ref }}
        # Cleanup removes workspace crates, but leaves empty authority directories.
        # Cache only Cargo profiles so source fetch always sees a fresh destination.
        cache-targets: false
        cache-directories: |
          target/debug
          target/release
        cache-bin: false
        cache-on-failure: true
        save-if: ${{ github.event_name != 'merge_group' }}
