name: BamTi clean-only interleaving candidate proof
on:
  push:
    branches: [ci/bamti-interleaved-candidate-20261127-r35]
    paths:
      - .github/workflows/bamti-interleaved-candidate-r35.yml
      - ci-tools/bamti-interleaved-candidate-r35/**
permissions:
  contents: read
concurrency:
  group: bamti-interleaved-candidate-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: proof
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            ci-tools/bamti-interleaved-candidate-r35
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 650e912e9f258cd9bf9fa43a59e556e44677833e
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: 0.13.9
          python-version: '3.15'
          enable-cache: false
      - name: Install the repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' source/rust-toolchain.toml)" = 1.97.1
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy,rust-src
          rustup default 1.97.1
      - name: Verify the frozen memo candidate and full quality gates
        shell: bash
        run: |
          set -euo pipefail
          export RUSTC_WRAPPER='' RUSTC_WORKSPACE_WRAPPER='' CARGO_INCREMENTAL=0
          uv run --no-project --python 3.15 proof/ci-tools/bamti-interleaved-candidate-r35/verify.py
      - name: Confirm original source restoration
        if: always()
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 650e912e9f258cd9bf9fa43a59e556e44677833e
          test -z "$(git status --porcelain)"
          echo BAMTI_MEMO_FINAL_SOURCE_RESTORED
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bamti-interleaved-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/bamti-interleaved-candidate-r35
          if-no-files-found: error
          retention-days: 14
