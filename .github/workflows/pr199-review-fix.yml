name: PR 199 review-fix bootstrap

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.event.pull_request.number == 199 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diamond/walker-lockstep-pins'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Reassemble and validate patch
        run: |
          set -euo pipefail
          cat .github/pr199-review-fixes.part-*.patch > /tmp/pr199-review-fixes.patch
          git apply --check /tmp/pr199-review-fixes.patch
          git apply /tmp/pr199-review-fixes.patch
          git diff --check
          printf '%s\n' \
            .github/workflows/ci.yml \
            crates/bamts-compiler/src/checker.rs \
            crates/bamts-compiler/src/checker/binder.rs \
            crates/bamts-compiler/src/emitter.rs \
            crates/bamts-compiler/src/emitter/transforms.rs \
            crates/bamts-compiler/src/parser.rs | sort > /tmp/expected-paths
          git diff --name-only | sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

      - name: Install Rust toolchain
        run: |
          TOOLCHAIN=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$TOOLCHAIN"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Focused review regressions
        run: cargo test --locked -p bamts-compiler --lib pr199_

      - name: Fetch pinned TypeScript test fixtures
        run: >-
          cargo run --locked -p bamts-verification -- source fetch
          typescript-primary-tests --dest target/authority/typescript-7.0.2-tests

      - name: Compiler regression suite
        run: cargo test --locked -p bamts-compiler --lib

      - name: Compiler clippy
        run: cargo clippy --locked -p bamts-compiler --all-targets -- -D warnings

  apply:
    needs: validate
    if: >-
      github.event.pull_request.number == 199 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diamond/walker-lockstep-pins'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact validated PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply validated patch and remove bootstrap
        run: |
          set -euo pipefail
          cat .github/pr199-review-fixes.part-*.patch > /tmp/pr199-review-fixes.patch
          git apply --check /tmp/pr199-review-fixes.patch
          git apply /tmp/pr199-review-fixes.patch
          git diff --check
          git rm .github/pr199-review-fixes.part-*.patch .github/workflows/pr199-review-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml \
            crates/bamts-compiler/src/checker.rs \
            crates/bamts-compiler/src/checker/binder.rs \
            crates/bamts-compiler/src/emitter.rs \
            crates/bamts-compiler/src/emitter/transforms.rs \
            crates/bamts-compiler/src/parser.rs
          git commit -m 'Fix remaining PR #199 review findings'
          git push origin "HEAD:refs/heads/${{ github.event.pull_request.head.ref }}"
