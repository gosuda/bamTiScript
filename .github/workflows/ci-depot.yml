name: CI (Depot)

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: toolchain
        run: rustup toolchain install
      - name: Cache Rust dependencies
        uses: ./.github/actions/rust-cache
      - run: cargo fmt --all --check
      - if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 60
    env:
      QUINT_HOME: /tmp/quint
      TZ: UTC
      LANG: C
      LC_ALL: C
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Node 24.18.0 (the version the repo pins)
        run: |
          curl -fsSL https://nodejs.org/dist/v24.18.0/node-v24.18.0-linux-x64.tar.xz | sudo tar -xJ -C /opt
          sudo ln -sf /opt/node-v24.18.0-linux-x64/bin/{node,npm,npx} /usr/local/bin/
          command -v node && test "$(node --version)" = v24.18.0
      - run: rustup toolchain install
      - name: Cache npm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json', 'formal/quint/package-lock.json') }}
          restore-keys: |
            npm-
      - name: Cache Rust dependencies
        uses: ./.github/actions/rust-cache
      - name: Install dependencies (npm, cargo, Quint)
        id: dependencies
        run: |
          npm ci
          cargo fetch --locked
          npm ci --prefix formal/quint
          v=$(node -p 'require("./formal/quint/node_modules/@informalsystems/quint/dist/src/rust/binaryManager.js").QUINT_EVALUATOR_VERSION')
          test "$v" = v0.6.0
          d="$QUINT_HOME/rust-evaluator-$v"; mkdir -p "$d"
          curl -fsSL --retry 3 -o /tmp/q.tgz "https://github.com/quint-co/quint/releases/download/evaluator/$v/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz"
          echo "61755a09d5052d93a4e75e840059edfd0d3674aeda164b9d2464be3d6e21b1c2  /tmp/q.tgz" | sha256sum --check --strict
          tar -xzf /tmp/q.tgz -C "$d" quint_evaluator && chmod +x "$d/quint_evaluator"
      - name: Fetch pinned TypeScript test fixtures
        run: cargo run --locked -p bamts-verification -- source fetch typescript-primary-tests --dest target/authority/typescript-7.0.2-tests
      - name: Test workspace (includes the corpus differential)
        run: cargo test --workspace --locked --no-fail-fast
      - name: Test pinned Node oracle contracts
        run: >-
          cargo test --locked -p bamts-verification --lib -- --ignored --exact
          corpus::tests::verify_node_version_accepts_pinned_and_rejects_missing
          corpus::tests::oracle_runs_a_real_corpus_case
          facets::tests::forged_unpinned_js_outcomes_are_not_a_public_proof_path
      - name: Test npm interfaces
        run: node --test --test-skip-pattern='staged cli-|clean consumer' npm/test/*.test.mjs
      - name: Test Linux native addon lifecycle
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import { mkdir, readFile, rm, writeFile } from "node:fs/promises";
          import { join, resolve } from "node:path";
          import { createNativeBuildPlan, NATIVE_RELEASE_TARGETS } from "./npm/scripts/native-build-plan.mjs";
          import { packageNativeTarget } from "./npm/scripts/package-native-platform.mjs";

          const hashFile = async (path) =>
            createHash("sha256").update(await readFile(path)).digest("hex");
          const sourceCommit = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          const { version } = JSON.parse(await readFile("npm/bamti/package.json", "utf8"));
          const toolchainSource = await readFile("rust-toolchain.toml", "utf8");
          const toolchain = /channel\s*=\s*"([^"]+)"/.exec(toolchainSource)?.[1];
          if (toolchain === undefined) throw new Error("rust-toolchain.toml has no pinned channel");
          const cargoLockSha256 = await hashFile("Cargo.lock");
          const workflowRevision = await hashFile(".github/workflows/ci-depot.yml");
          const builderRevision = await hashFile("npm/scripts/package-native-platform.mjs");
          const { canonicalPlan, buildSetId } = createNativeBuildPlan({
            sourceCommit, sourceVersion: version, cargoLockSha256,
            workflowRevision, toolchain, builderRevision, targets: NATIVE_RELEASE_TARGETS,
          });
          const smokeRoot = resolve("target/native-smoke");
          await rm(smokeRoot, { recursive: true, force: true });
          await mkdir(smokeRoot, { recursive: true });
          await writeFile(join(smokeRoot, "native-build-plan.json"), canonicalPlan);
          const { record, tarballPath } = await packageNativeTarget("x86_64-unknown-linux-gnu", {
            outputDirectory: join(smokeRoot, "dist"),
            sourceCommit, buildSetId, cargoLockSha256,
            workflowRevision, toolchain, builderRevision,
          });
          const stage = join(smokeRoot, "stage");
          await mkdir(stage);
          execFileSync("tar", ["-xzf", tarballPath, "-C", stage], { stdio: "inherit" });
          execFileSync(process.execPath, ["--test", "npm/test/bamti-native-addon-lifecycle.test.mjs"], {
            stdio: "inherit",
            env: {
              ...process.env,
              BAMTI_NATIVE_ADDON_PATH: join(stage, "package", record.entry),
              BAMTI_EXPECTED_SOURCE_COMMIT: sourceCommit,
              BAMTI_EXPECTED_BUILD_SET_ID: buildSetId,
            },
          });
          NODE

  formal:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 45
    env:
      QUINT_HOME: /tmp/quint
      V: cargo run --locked -q -p bamts-verification --bin bamts-verification --
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Node 24.18.0 (the version the repo pins)
        run: |
          curl -fsSL https://nodejs.org/dist/v24.18.0/node-v24.18.0-linux-x64.tar.xz | sudo tar -xJ -C /opt
          sudo ln -sf /opt/node-v24.18.0-linux-x64/bin/{node,npm,npx} /usr/local/bin/
          command -v node && test "$(node --version)" = v24.18.0
      - run: rustup toolchain install
      - name: Cache npm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json', 'formal/quint/package-lock.json') }}
          restore-keys: |
            npm-
      - name: Cache Rust dependencies
        uses: ./.github/actions/rust-cache
      - name: Install Quint, Racket 9.2 and Lean while the verifier builds
        run: |
          (cargo fetch --locked -q && cargo build --locked -q -p bamts-verification --bin bamts-verification) & b=$!
          npm ci --prefix formal/quint
          v=$(node -p 'require("./formal/quint/node_modules/@informalsystems/quint/dist/src/rust/binaryManager.js").QUINT_EVALUATOR_VERSION')
          test "$v" = v0.6.0
          d="$QUINT_HOME/rust-evaluator-$v"; mkdir -p "$d"
          curl -fsSL --retry 3 -o /tmp/q.tgz "https://github.com/quint-co/quint/releases/download/evaluator/$v/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz"
          echo "61755a09d5052d93a4e75e840059edfd0d3674aeda164b9d2464be3d6e21b1c2  /tmp/q.tgz" | sha256sum --check --strict
          tar -xzf /tmp/q.tgz -C "$d" quint_evaluator && chmod +x "$d/quint_evaluator"
          curl -fsSLo /tmp/racket.sh https://download.racket-lang.org/installers/9.2/racket-9.2-x86_64-linux-cs.sh
          sudo sh /tmp/racket.sh --create-dir --unix-style --dest /usr/local
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none --no-modify-path
          sudo ln -sf ~/.elan/bin/* /usr/local/bin/
          (cd formal/lean && lake build)
          wait $b
      - name: Fetch catalog authority
        id: authority
        run: |
          $V source fetch typescript-primary-tests --dest target/authority/typescript-7.0.2-tests
          $V source fetch typescript-6.0-tests --dest target/authority/typescript-6.0.2-tests
          $V source fetch typescript-compat-tests --dest target/authority/typescript-5.9.3-tests
          $V source fetch test262 --dest target/authority/test262
      - run: $V catalog regenerate --release typescript-7.0.2 --check
      - if: ${{ !cancelled() && steps.authority.outcome == 'success' }}
        run: $V formal audit --gates G1,G2,G5,G3,G4

  conformance:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 60
    env:
      V: target/release/bamts-verification
      BAMTS_SUITE_COMPILER_ADAPTER: target/release/ts_lane_worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Node 24.18.0 (the version the repo pins)
        run: |
          curl -fsSL https://nodejs.org/dist/v24.18.0/node-v24.18.0-linux-x64.tar.xz | sudo tar -xJ -C /opt
          sudo ln -sf /opt/node-v24.18.0-linux-x64/bin/{node,npm,npx} /usr/local/bin/
          command -v node && test "$(node --version)" = v24.18.0
      - run: rustup toolchain install
      - name: Cache npm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json', 'formal/quint/package-lock.json') }}
          restore-keys: |
            npm-
      - name: Cache Rust dependencies
        uses: ./.github/actions/rust-cache
      - name: Build receipt tools, sync snapshot, audit ledger
        run: |
          npm ci
          cargo build --locked --release -p bamts-verification --bin bamts-verification --bin ts_lane_worker --bin ts_conformance
          status=0
          target/release/ts_conformance sync --verify-pin --write-snapshot || status=1
          target/release/ts_conformance audit-ledger --require-complete || status=1
          exit "$status"
      - name: Fetch pinned TypeScript authority
        run: |
          $V source fetch typescript-7-compiler --dest target/authority/typescript-7.0.2
          $V source fetch typescript-primary-tests --dest target/authority/typescript-7.0.2-tests
      - name: Conformance receipts (4 parallel shards), merge and check
        run: |
          # shellcheck disable=SC2086
          seq 0 3 | xargs -P4 -I{} $V suite run --catalog typescript-7.0.2 --shard "{}/4" \
            --receipt "target/receipts/{}.jsonl" --runner compiler --platform x86_64-unknown-linux-gnu \
            --workflow .github/workflows/ci-depot.yml --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha "$(git rev-parse HEAD)" \
            --job conformance --host ubuntu-24.04-x64 \
            --runtime "node-$(node --version);rust-$(rustc --version)"
          mkdir -p target/merged
          $V suite merge --catalog typescript-7.0.2 --receipts target/receipts --out target/merged/receipt.jsonl
          $V suite merge --catalog typescript-7.0.2 --receipts target/receipts --out target/merged/receipt.jsonl --check
      - name: Upload conformance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: conformance-receipt
          path: target/merged
          if-no-files-found: error
